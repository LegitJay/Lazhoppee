<div class="notifications-container">
  <h1>Notifications</h1>
  <div class="notifications-list">
    <div *ngIf="notifications.length === 0" class="empty-state">
      <p>You have no new notifications.</p>
    </div>
    <div *ngFor="let notification of notifications" class="notification-item" [class.unread]="!notification.read">
      <div class="notification-content">
        <p>{{ notification.message }}</p>
        <span class="timestamp">{{ notification.timestamp }}</span>
      </div>
      <div class="notification-actions">
        <button *ngIf="!notification.read" (click)="markAsRead(notification)" class="action-btn">Mark as Read</button>
        <button (click)="deleteNotification(notification)" class="action-btn delete-btn">Delete</button>
      </div>
    </div>
  </div>
</div>
