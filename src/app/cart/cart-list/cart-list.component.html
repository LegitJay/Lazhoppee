<div class="container-sm">
    <h2 class="cart-title">Cart</h2>

    <div class="cart-grid">
        <div class="cart-item" *ngFor="let item of cartItems">
            <img class="item-thumb" src="/assets/images/{{item.imageUrl}}" [alt]="item.name">
            <div class="item-info">
                <span class="item-name">{{item.name}}</span>
                <span class="item-price">{{item.price | currency: 'PHP'}}</span>
            </div>
        </div>
    </div>

    <mat-card class="summary-card">
        <div class="total-row">
            <span class="price">Total</span>
            <span class="price">{{totalPrice | currency: 'PHP'}}</span>
        </div>
        <div class="actions-row">
            <button mat-flat-button (click)="clearCart()">Clear</button>
            <button mat-raised-button color="accent" (click)="checkout()">Checkout</button>
        </div>
    </mat-card>
</div>
