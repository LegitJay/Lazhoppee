<div class="cart-page">
    <h2 class="cart-title">Shopping Cart</h2>

    <div class="cart-layout" *ngIf="cartItems.length > 0; else empty">

        <!-- LINE ITEMS -->
        <div class="cart-items">
            <div class="cart-row" *ngFor="let item of cartItems; let i = index"
                [style.animation-delay]="(i * 0.05) + 's'">
                <img [src]="'/' + item.imageUrl" [alt]="item.name" class="row-thumb">

                <div class="row-info">
                    <span class="row-name">{{ item.name }}</span>
                    <span class="row-unit-price">{{ item.price | currency: 'PHP' }} each</span>
                </div>

                <div class="qty-control">
                    <button class="qty-btn" (click)="decrease(item)">−</button>
                    <span class="qty-value">{{ item.quantity }}</span>
                    <button class="qty-btn" (click)="increase(item)">+</button>
                </div>

                <span class="row-subtotal">{{ item.price * item.quantity | currency: 'PHP' }}</span>

                <button class="remove-btn" (click)="removeItem(item)" aria-label="Remove item">✕</button>
            </div>
        </div>

        <!-- ORDER SUMMARY -->
        <aside class="order-summary">
            <h3>Order Summary</h3>
            <div class="summary-row">
                <span>Subtotal</span>
                <span>{{ totalPrice | currency: 'PHP' }}</span>
            </div>
            <div class="summary-row">
                <span>Shipping</span>
                <span class="free">Free</span>
            </div>
            <div class="summary-row total-row">
                <span>Total</span>
                <span>{{ totalPrice | currency: 'PHP' }}</span>
            </div>

            <button class="checkout-btn" (click)="checkout()">Checkout</button>
            <button class="clear-btn" (click)="clearCart()">Clear Cart</button>
        </aside>
    </div>

    <ng-template #empty>
        <div class="empty-state">
            <p>Your cart is empty.</p>
            <a routerLink="/products" class="continue-link">Continue Shopping</a>
        </div>
    </ng-template>
</div>
