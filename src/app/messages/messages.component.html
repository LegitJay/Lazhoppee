<div class="inbox-container">
  <aside class="conversation-list">
    <h2 class="inbox-title">Messages</h2>
    <div class="convo-item" *ngFor="let convo of conversations"
         [class.active]="activeConversation?._id === convo._id"
         (click)="selectConversation(convo)">
      <ng-container *ngIf="otherParty(convo) as otherUser">
        <div class="convo-avatar">
          <img *ngIf="otherUser.profileImage" [src]="otherUser.profileImage" alt="">
          <span *ngIf="!otherUser.profileImage">{{ getInitial(otherUser) }}</span>
        </div>
        <div class="convo-info">
          <span class="convo-name">{{ getDisplayName(otherUser) }}</span>
          <span class="convo-preview">{{ convo.lastMessage || 'Start the conversation' }}</span>
        </div>
      </ng-container>
    </div>
    <p *ngIf="!conversations.length" class="empty-inbox">No conversations yet.</p>
  </aside>

  <section class="chat-panel" *ngIf="activeConversation">
    <div class="chat-header">{{ getDisplayName(otherParty(activeConversation)) }}</div>
    <div class="chat-messages">
      <div *ngFor="let msg of messages"
           class="chat-bubble"
           [class.own]="msg.sender._id === currentUserId">
        {{ msg.text }}
      </div>
    </div>
    <div class="chat-input-row">
      <input [(ngModel)]="newMessageText" (keyup.enter)="send()" placeholder="Type a message...">
      <button (click)="send()">Send</button>
    </div>
  </section>

  <section class="chat-panel empty-state" *ngIf="!activeConversation">
    <p>Select a conversation to start chatting.</p>
  </section>
</div>
