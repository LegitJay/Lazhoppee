<header class="site-header" *ngIf="!isAdminRoute">
    <div class="header-row">
        <a routerLink="/" class="brand">
            <img class="brand-logo" src="/assets/images/KRSSVR LOGO-03.svg" alt="Kross Over">
        </a>

        <nav class="nav-links">
            <a routerLink="/products" routerLinkActive="active" class="nav-link">Products</a>
        </nav>

        <div class="header-search">
            <input type="text" placeholder="Search products" class="search-input" [(ngModel)]="searchTerm" (keyup.enter)="onSearch()">
            <button class="search-btn" (click)="onSearch()" aria-label="Search">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="7"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>
        </div>

        <a routerLink="/cart" class="cart-link" aria-label="Cart">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="9" cy="21" r="1"></circle>
                <circle cx="20" cy="21" r="1"></circle>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
            <span class="cart-badge" *ngIf="cartCount > 0">{{cartCount}}</span>
        </a>

        <a routerLink="/messages" class="header-message-btn" *ngIf="isLoggedIn" aria-label="Messages">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
            </svg>
            <span class="unread-badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
        </a>

        <ng-container *ngIf="isLoggedIn; else loggedOut">
            <a routerLink="/profile" routerLinkActive="active" class="nav-link">Profile</a>
            <button type="button" class="nav-link nav-link--button" (click)="logout()">Logout</button>
        </ng-container>
        <ng-template #loggedOut>
            <a routerLink="/auth" routerLinkActive="active" class="nav-link">Login</a>
        </ng-template>
    </div>
</header>

<router-outlet></router-outlet>
