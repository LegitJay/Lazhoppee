<div class="order-list-container">
  <div class="order-list-header">
    <h2 class="order-list-title">Order management</h2>
    <span class="order-list-count" *ngIf="orders.length > 0">{{ orders.length }} orders</span>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Order ID</th>
          <th>Customer</th>
          <th>Total</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let order of orders">
          <td><span class="order-id">{{ order._id }}</span></td>
          <td>
            <span class="customer-name" *ngIf="isUser(order.buyer)">
              {{ order.buyer.username }}
            </span>
          </td>
          <td><span class="order-total">{{ order.total | currency:'PHP':'symbol' }}</span></td>
          <td>
            <span class="status-badge" [ngClass]="'status-' + order.status">
              {{ order.status }}
            </span>
          </td>
          <td>
            <div class="action-btns">
              <button class="confirm-btn" (click)="confirmOrder(order)" [disabled]="order.status !== 'pending'">
                Confirm
              </button>
              <button class="reject-btn" (click)="rejectOrder(order)" [disabled]="order.status !== 'pending'">
                Reject
              </button>
            </div>
          </td>
        </tr>
        <tr *ngIf="orders.length === 0">
          <td colspan="5" class="empty-row">No orders yet.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
