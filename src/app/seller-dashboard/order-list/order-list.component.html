<div class="order-list-container">
  <h2>Order Management</h2>
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Order ID</th>
          <th>Customer</th>
          <th>Total</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let order of orders">
          <td>{{ order._id }}</td>
          <td>
            <ng-container *ngIf="isUser(order.buyer)">
              {{ order.buyer.username }}
            </ng-container>
          </td>
          <td>{{ order.total | currency:'PHP':'symbol' }}</td>
          <td>
            <span class="status-pill" [ngClass]="{
              'status-pending': order.status === 'pending',
              'status-confirmed': order.status === 'confirmed',
              'status-rejected': order.status === 'rejected'
            }">{{ order.status }}</span>
          </td>
          <td class="actions">
            <button (click)="confirmOrder(order)" [disabled]="order.status !== 'pending'">Confirm</button>
            <button (click)="rejectOrder(order)" [disabled]="order.status !== 'pending'">Reject</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
