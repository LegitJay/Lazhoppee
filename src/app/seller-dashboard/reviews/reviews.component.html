<div class="reviews-container">
  <h2>Customer Reviews</h2>
  <div *ngIf="isLoading" class="loading-spinner"></div>
  <div *ngIf="!isLoading && reviews.length === 0" class="no-reviews">
    You have no reviews yet.
  </div>
  <div *ngIf="!isLoading && reviews.length > 0">
    <div *ngFor="let review of reviews" class="review-card">
      <div class="review-header">
        <strong>{{ review.user.username }}</strong>
        <span>{{ review.createdAt | date:'medium' }}</span>
      </div>
      <div class="review-rating">
        <span *ngFor="let i of [].constructor(review.rating)">★</span>
        <span *ngFor="let i of [].constructor(5 - review.rating)">☆</span>
      </div>
      <p>{{ review.comment }}</p>
    </div>
  </div>
</div>
