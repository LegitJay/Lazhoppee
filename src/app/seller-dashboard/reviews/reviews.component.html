<div class="reviews-container">

  <div class="reviews-header">
    <h2>Customer Reviews</h2>
    <span *ngIf="!isLoading && reviews.length > 0">({{ reviews.length }})</span>
  </div>

  <!-- Loading -->
  <div *ngIf="isLoading" class="reviews-empty">
    <p>Loading reviews...</p>
  </div>

  <!-- Empty -->
  <div *ngIf="!isLoading && reviews.length === 0" class="reviews-empty">
    <p>No reviews yet.</p>
  </div>

  <!-- Review list -->
  <div *ngIf="!isLoading && reviews.length > 0" class="review-list">
    <div class="review-card" *ngFor="let r of reviews">

      <div class="review-card-header">
        <div class="reviewer-info">
          <div class="reviewer-avatar-placeholder" *ngIf="!getProfileImage(r.user)">
            {{ getInitial(r.user) }}
          </div>
          <img *ngIf="getProfileImage(r.user)" [src]="getProfileImage(r.user)" class="reviewer-avatar"
            [alt]="getUsername(r.user)">
          <div class="reviewer-meta">
            <span class="reviewer-name">{{ getUsername(r.user) }}</span>
            <span class="review-product" *ngIf="getProductName(r.product)">
              on <strong>{{ getProductName(r.product) }}</strong>
            </span>
          </div>
        </div>
        <div class="review-right">
          <div class="review-stars">
            <span *ngFor="let i of [1,2,3,4,5]" [class.filled]="i <= r.rating">★</span>
          </div>
          <span class="review-date">{{ r.createdAt | date:'MMM d, y' }}</span>
        </div>
      </div>

      <p class="review-comment">{{ r.comment }}</p>
    </div>
  </div>

</div>
