<div class="admin-login-shell">
  <div class="admin-login-card">
    <p class="admin-eyebrow">Admin</p>
    <h1 class="admin-title">Sign in</h1>
    <p class="admin-error" *ngIf="errorMessage">{{ errorMessage }}</p>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <label class="admin-field">
        <span class="admin-label">Email</span>
        <input type="email" name="email" [(ngModel)]="email" required />
      </label>

      <label class="admin-field">
        <span class="admin-label">Password</span>
        <input type="password" name="password" [(ngModel)]="password" required />
      </label>

      <button type="submit" class="admin-submit" [disabled]="loginForm.invalid || isSubmitting">
        {{ isSubmitting ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>
  </div>
</div>
